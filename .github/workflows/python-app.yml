name: Build Disklavier Converter

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: x86
          - os: macos-latest
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows.txt
            requirements-windows-x86.txt

      - name: Install Unix dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements.txt

      - name: Install Windows x64 dependencies
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: python -m pip install -r requirements-windows.txt

      - name: Install Windows x86 dependencies
        if: runner.os == 'Windows' && matrix.arch == 'x86'
        shell: pwsh
        run: python -m pip install -r requirements-windows-x86.txt

      - name: Run syntax checks
        run: python -m py_compile disklavier_converter.py filter_recovered_midi.py

      - name: Validate Yamaha templates
        run: python -c "import pathlib; p=pathlib.Path('yamaha_templates.bin'); assert p.stat().st_size == 16*2240*2"

      - name: Build executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build_windows.ps1 -SkipInstaller

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: iscc DisklavierConverter.iss

      - name: Build executable on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile
          --name DisklavierConverter
          --add-data "yamaha_templates.bin:."
          disklavier_converter.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DisklavierConverter-${{ runner.os }}-${{ matrix.arch }}
          path: dist/DisklavierConverter*
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DisklavierConverter-Setup-${{ matrix.arch }}
          path: installer/DisklavierConverterSetup.exe
          if-no-files-found: error
