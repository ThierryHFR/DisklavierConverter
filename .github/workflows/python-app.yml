name: Build Disklavier Converter

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: native
          - os: windows-latest
            arch: x64
            target: native
          - os: windows-latest
            arch: x86
            target: native
          - os: windows-latest
            arch: x86
            target: windows-7-x86
          - os: macos-latest
            arch: x64
            target: native

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.target == 'windows-7-x86' && '3.8' || '3.11' }}
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows.txt
            requirements-windows-x86.txt
            requirements-windows-7-x86.txt

      - name: Install Unix dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements.txt

      - name: Install Windows x64 dependencies
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: python -m pip install -r requirements-windows.txt

      - name: Install Windows x86 dependencies
        if: runner.os == 'Windows' && matrix.arch == 'x86' && matrix.target != 'windows-7-x86'
        shell: pwsh
        run: python -m pip install -r requirements-windows-x86.txt

      - name: Install Windows 7 x86 dependencies
        if: runner.os == 'Windows' && matrix.target == 'windows-7-x86'
        shell: pwsh
        run: python -m pip install -r requirements-windows-7-x86.txt

      - name: Run syntax checks
        run: python -m py_compile disklavier_converter.py disklavier_gui.py filter_recovered_midi.py

      - name: Validate Yamaha templates
        run: python -c "import pathlib; p=pathlib.Path('yamaha_templates.bin'); assert p.stat().st_size == 16*2240*2"

      - name: Build executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: if ('${{ matrix.target }}' -eq 'windows-7-x86') { .\build_windows.ps1 -SkipInstaller -Windows7X86 } else { .\build_windows.ps1 -SkipInstaller }

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: iscc DisklavierConverter.iss

      - name: Build executable on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile
          --windowed
          --name DisklavierConverter
          --add-data "yamaha_templates.bin:."
          disklavier_gui.py

      - name: Package Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          tar -czf "package/DisklavierConverter-Linux-${{ matrix.arch }}-${{ matrix.target }}.tar.gz" \
            -C dist DisklavierConverter

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p package
          if [ -d dist/DisklavierConverter.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              dist/DisklavierConverter.app \
              "package/DisklavierConverter-macOS-${{ matrix.arch }}-${{ matrix.target }}.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent \
              dist/DisklavierConverter \
              "package/DisklavierConverter-macOS-${{ matrix.arch }}-${{ matrix.target }}.zip"
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DisklavierConverter-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.target }}
          path: dist/DisklavierConverter*
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DisklavierConverter-Setup-${{ matrix.arch }}-${{ matrix.target }}
          path: installer/DisklavierConverterSetup.exe
          if-no-files-found: error

      - name: Upload Unix installer package
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DisklavierConverter-Installer-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.target }}
          path: package/*
          if-no-files-found: error
