name: Build Disklavier Converter

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run syntax checks
        run: python -m py_compile disklavier_converter.py filter_recovered_midi.py

      - name: Validate Yamaha templates
        run: python -c "import pathlib; p=pathlib.Path('yamaha_templates.bin'); assert p.stat().st_size == 16*2240*2"

      - name: Build executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build_windows.ps1 -SkipInstaller

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: iscc DisklavierConverter.iss

      - name: Build executable on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile
          --name DisklavierConverter
          --add-data "yamaha_templates.bin:."
          disklavier_converter.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DisklavierConverter-${{ runner.os }}
          path: dist/DisklavierConverter*
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DisklavierConverter-Setup
          path: installer/DisklavierConverterSetup.exe
          if-no-files-found: error
